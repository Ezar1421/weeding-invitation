<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNDANGAN PERNIKAHAN</title>

    <!-- Google Fonts & Bootstrap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Properti/bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    
    <!-- CSS Utama & CSS Khusus Cover -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="cover.css">
</head>
    
<body>

    <!-- HALAMAN COVER UTAMA -->
    <div class="welcome-cover section-halaman">
        <h1 class="Judul">UNDANGAN PERNIKAHAN</h1>
        <img src="Properti/Gunungan.png" alt="Gunungan" class="gunungan">
        
        <h1 class="Nama">Armand & Surti</h1>
        <p class="Kepada">Kepada Yth. Bapak/Ibu/Saudara/i</p>

        <div class="kotaktamu">
            Tamu Undangan
        </div>

        <button type="button" class="btn-buka" id="btnBuka">
            BUKA UNDANGAN
        </button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Ambil Nama Tamu dari URL Query (contoh: index.html?to=Bapak+Budi)
            const urlParams = new URLSearchParams(window.location.search);
            const namaTamu = urlParams.get("to");
            const kotakTamu = document.querySelector(".kotaktamu");

            if (namaTamu && kotakTamu) {
                kotakTamu.textContent = namaTamu;
            }

            // Pindah Halaman ke undangan.html saat tombol diklik
            const btnBuka = document.getElementById("btnBuka");
            if (btnBuka) {
                btnBuka.addEventListener("click", function () {
                    window.location.href = "isi.html" + window.location.search;
                });
            }
        });
    </script>
</body>
</html>
